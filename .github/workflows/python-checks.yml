name: Python checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core test requirements
        run: python -m pip install --upgrade pip numpy scipy pyyaml
      - name: Python syntax
        run: python -m compileall -q acquisition art eval processing speller upload voice common.py tests
      - name: Focused unit tests
        run: python -m unittest discover -s tests -v
